name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps are generated by Next; create them before tsc.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Test
        run: npm test

      # Builds without Supabase env vars — the app runs in local-only mode.
      - name: Build
        run: npm run build
